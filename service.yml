name: moodle
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.2.4"
title: PHP (Moodle)

labels:
- moodle

# Moodle 5.3 supports PHP 8.3 and 8.4.
options:
- version: '8.4'
  default: true
- version: '8.3'

links:
# Moodle has separate drivers for MariaDB and MySQL, which the shared driver
# variable does not tell apart.
- name: db
  env:
  - name: DB_KIND
    value: '{{link.database.kind}}'
- name: moodledata
  title: Moodle data storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

# Moodle's data directory. Every replica and the cron worker read and write the
# same files, so the volume is shared.
volumes:
- name: moodledata
  title: Moodle data
  link: moodledata
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82

settings:
# The administrator account the first deployment creates. Moodle is installed
# from these values instead of its web installer.
- name: admin-username
  title: Admin username
  description: Username of the Moodle administrator created on the first deployment.
  default: admin
  var: MOODLE_ADMIN_USERNAME
- name: admin-password
  title: Admin password
  description: Password of the Moodle administrator created on the first deployment. A password that doesn't meet Moodle's password policy must be changed at the first sign-in.
  required: true
  secret: true
  var: MOODLE_ADMIN_PASSWORD
- name: admin-email
  title: Admin email
  description: Email address of the Moodle administrator. When empty, Moodle asks for it at the first sign-in.
  var: MOODLE_ADMIN_EMAIL

env:
# The site's names on the first deployment; both can be changed in Moodle later.
- name: MOODLE_SITE_FULLNAME
  value: '{{app.title}}'
- name: MOODLE_SITE_SHORTNAME
  value: '{{app.name}}'
- name: MOODLE_DATAROOT
  value: /mnt/files/moodledata
# Moodle refuses to save forms with more fields than this, such as large
# grader reports and role definitions.
- name: PHP_MAX_INPUT_VARS
  value: '5000'
- name: PHP_UPLOAD_MAX_FILESIZE
  value: 256M
- name: PHP_POST_MAX_SIZE
  value: 256M
# Moodle's installer and security check ask for this in every environment, so
# that stack traces carry no argument values such as passwords.
- name: PHP_ZEND_EXCEPTION_IGNORE_ARGS
  value: '1'

derivatives:
# Moodle needs its cron every minute, more often than a service cron schedule
# runs. This worker keeps Moodle's cron running instead: each run polls for new
# tasks for 15 minutes, Moodle's longest keep-alive, and the next one follows.
- name: moodle-cron
  icon: moodle
  title: Moodle Cron
  args:
  - sh
  - -c
  - |
    # Moodle's cron stops after its current task on SIGTERM. The image's stop
    # signal is SIGQUIT, for PHP-FPM, so a stop is passed on to cron as SIGTERM.
    trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT QUIT
    while true; do
      php admin/cli/cron.php --keep-alive=900 &
      pid=$!
      # Cron fails until Moodle is installed; it is tried again a minute later.
      wait "$pid" || { sleep 60 & pid=$!; wait "$pid"; }
    done
  type: service
  default: true
  required: false

build:
  connect: true
  dockerfile: Dockerfile
  boilerplates:
  - name: vanilla
    title: Vanilla Moodle
    repo: https://github.com/moodle/moodle
    tag: ~5.3
    pipeline: pipeline.yml
    optionVersionConstraint: "^8.3"

actions:
# Installs Moodle on the first deployment and upgrades it on later ones, so the
# web installer is never used: no one else can claim the site before its admin,
# and no page is loaded while the installer rebuilds Moodle's caches.
- name: upgrade
  title: Install or upgrade Moodle
  args:
  - sh
  - -c
  - |
    set -eu
    # An installed site is upgraded when the deployed code is newer.
    if php admin/cli/cfg.php --name=version >/dev/null 2>&1; then
      exec php admin/cli/upgrade.php --non-interactive
    fi
    if [ -z "${MOODLE_ADMIN_PASSWORD:-}" ]; then
      echo "Moodle is not installed, or its database can't be read. To install it, set the Admin password setting of this service and deploy again." >&2
      exit 1
    fi
    # install_database.php stops when Moodle's tables exist, so a database that
    # couldn't be read above is never installed over. It takes the password only
    # as an argument, so it gets a throwaway one; the real password is set from
    # the environment next and never appears in a process list.
    php admin/cli/install_database.php --agree-license \
      --adminuser="${MOODLE_ADMIN_USERNAME:-admin}" \
      --adminpass="$(head -c 32 /dev/urandom | base64)" \
      --adminemail="${MOODLE_ADMIN_EMAIL:-}" \
      --fullname="${MOODLE_SITE_FULLNAME:-Moodle}" \
      --shortname="${MOODLE_SITE_SHORTNAME:-moodle}"
    # A password that doesn't meet Moodle's password policy must be changed at
    # the first sign-in.
    php -r '
      define("CLI_SCRIPT", true);
      require "config.php";
      $admin = get_admin();
      $password = getenv("MOODLE_ADMIN_PASSWORD");
      update_internal_user_password($admin, $password);
      $error = "";
      if (!check_password_policy($password, $error, $admin)) {
          set_user_preference("auth_forcepasswordchange", 1, $admin);
          echo "The admin password does not meet the password policy; Moodle will ask for a new one at the first sign-in.\n";
      }
    '
  type: post_deploy
- name: purge_caches
  title: Purge all caches
  args:
  - php
  - admin/cli/purge_caches.php
  type: button

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
