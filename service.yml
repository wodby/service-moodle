name: moodle
type: service
icon: moodle
title: Moodle
scalable: true
guidance: GUIDANCE.md

labels:
- moodle

# Moodle releases. Each tag of the wodby/moodle image holds that release with
# its Composer packages on PHP 8.4.
options:
- version: '5.3'
  default: true
  tag: 5.3-r0

endpoints:
- name: fpm
  ports:
  - name: fpm
    number: 9000
    main: true
    protocol: tcp

links:
- name: db
  title: Database
  required: true
  # A managed database server's CA certificate, mounted when the server has one, so Moodle connects over TLS.
  database:
    ca:
      filepath: /etc/wodby/db/ca.pem
  env:
  - name: DB_HOST
    value: '{{link.database.host}}'
  - name: DB_PORT
    value: '{{link.database.port}}'
  - name: DB_NAME
    value: '{{link.database.db.name}}'
  - name: DB_USERNAME
    value: '{{link.database.user.name}}'
  - name: DB_PASSWORD
    value: '{{link.database.user.password}}'
    secret: true
  # Moodle has separate drivers for MariaDB, MySQL and PostgreSQL.
  - name: DB_KIND
    value: '{{link.database.kind}}'
  # The path of the server's CA certificate when it has one, otherwise empty.
  - name: DB_SSL_CA
    value: '{{link.database.caFile}}'
  selectors:
  - type: db
    labels:
    - mariadb
  - type: db
    labels:
    - mysql
  - type: db
    labels:
    - postgres
- name: sendmail
  title: Mail Transfer Agent
  required: false
  env:
  - name: MSMTP_HOST
    value: '{{link.host}}'
  - name: MSMTP_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - smtpd
- name: moodledata
  title: Moodle data storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

# Moodle's data directory. Every replica and the cron worker read and write the
# same files, so the volume is shared.
volumes:
- name: moodledata
  title: Moodle data
  link: moodledata
  shared: true
  size: 10
  path: /mnt/files
  import:
    owner: 82
    group: 82

settings:
# The administrator account the first deployment creates. Moodle is installed
# from these values instead of its web installer.
- name: admin-username
  title: Admin username
  description: Username of the Moodle administrator created on the first deployment.
  default: admin
  var: MOODLE_ADMIN_USERNAME
- name: admin-password
  title: Admin password
  description: Password of the Moodle administrator created on the first deployment. A password that doesn't meet Moodle's password policy must be changed at the first sign-in.
  required: true
  secret: true
  var: MOODLE_ADMIN_PASSWORD
- name: admin-email
  title: Admin email
  description: Email address of the Moodle administrator. When empty, Moodle asks for it at the first sign-in.
  var: MOODLE_ADMIN_EMAIL

env:
# The site's names on the first deployment; both can be changed in Moodle later.
- name: MOODLE_SITE_FULLNAME
  value: '{{app.title}}'
- name: MOODLE_SITE_SHORTNAME
  value: '{{app.name}}'
- name: MOODLE_DATAROOT
  value: /mnt/files/moodledata

derivatives:
# Moodle needs its cron every minute, more often than a service cron schedule
# runs. This worker keeps Moodle's cron running; see moodle-cron in the image.
- name: moodle-cron
  icon: moodle
  title: Moodle Cron
  args:
  - moodle-cron
  type: service
  default: true
  required: false

actions:
# Installs Moodle on the first deployment and upgrades it on later ones, so the
# web installer is never used; see moodle-update in the image.
- name: upgrade
  title: Install or upgrade Moodle
  args:
  - moodle-update
  type: post_deploy
- name: purge_caches
  title: Purge all caches
  args:
  - php
  - admin/cli/purge_caches.php
  type: button

deployment:
  strategy: rolling
  maxUnavailable: 0
  maxSurge: 1
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/php-fpm
  chart: oci://registry-1.docker.io/wodby/php-fpm
  version: 0.3.3
  valueMappings:
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
    sidecars: sidecars
  containers:
  - name: php
    image: wodby/moodle
    # A prebuilt image, so Wodby passes the app's addresses only on request:
    # Moodle's address is WODBY_PRIMARY_URL.
    routeMetadata: true
    env:
    - name: PHP_FPM_CLEAR_ENV
      value: 'no'
    - name: PHP_DISPLAY_ERRORS
      value: 'Off'
      envType: prod
    - name: PHP_DISPLAY_STARTUP_ERRORS
      value: 'Off'
      envType: prod
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts

workspace: false
